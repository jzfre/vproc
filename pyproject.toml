[project]
name = "vproc"
version = "0.1.0"
description = "Grounded meeting-memory from video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "lancedb>=0.33",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pillow>=13.0",
    "imagehash>=4.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # SDK v2 removes mcp.server.fastmcp, which this service uses.
    "mcp>=1.30,<2",
    "numpy>=1.26",
    "filelock>=4.2.1",
    # Security floors also apply to wheel installs, which do not use uv.lock.
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "cryptography>=50",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8",
]

[project.optional-dependencies]
# Model libraries are optional; the server and remote-endpoint ingest work without them.
answer = ["transformers>=4.51,<5", "torch>=2.4", "fsspec>=2026.6"]
diarization = [
    "pyannote-audio>=4.0",
    # Patched transitive dependencies for optional local-model installs.
    "aiohttp>=3.14.4",
    "fsspec>=2026.6",
    "lightning>=2.6.6",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.2",
    "pytorch-lightning>=2.6.6",
    # Direct Linux requirements only so the CPU wheel source below applies to them as well
    # (uv sources cover direct dependencies); pyannote already depends on both.
    "torchaudio>=2.8; sys_platform == 'linux'",
    "torchcodec>=0.7; sys_platform == 'linux'",
]
local-asr = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Convenience install for all supported local model features.
runtime = [
    # HHEM's trust_remote_code model (modeling_hhem_v2.py) targets the transformers 4.x
    # API; 5.x renamed internals (all_tied_weights_keys) and breaks model load. Cap <5.
    "transformers>=4.51,<5",
    "torch>=2.4",
    "pyannote-audio>=4.0",
    # Patched transitive dependencies for optional local-model installs.
    "aiohttp>=3.14.4",
    "fsspec>=2026.6",
    "lightning>=2.6.6",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.2",
    "pytorch-lightning>=2.6.6",
    "torchaudio>=2.8; sys_platform == 'linux'",
    "torchcodec>=0.7; sys_platform == 'linux'",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
vproc = "vproc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vproc"]

[tool.hatch.build.targets.sdist]
# Explicit release contents: never bundle local recordings, indexes, caches, or secrets.
include = [
    "/vproc",
    "/tests",
    "/evals",
    "/scripts",
    "/docs/brain",
    "/docs/works",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build.targets.sdist.force-include]
".env.example" = ".env.example"

[tool.pytest.ini_options]
pythonpath = ["."]

# vproc has no CUDA code path (models run on CPU, or MPS on a Mac), so Linux installs take
# PyTorch's CPU wheels: PyPI's Linux torch pulls ~5 GB of CUDA libraries, and PyPI's Linux
# torchcodec cannot even load without them. macOS resolution is unchanged. These sources are
# not wheel metadata: for a wheel install use `uv pip install --torch-backend cpu ...`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
